[build]
  command = "npm run build"
  publish = "build"

# Cache static assets and images aggressively for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"